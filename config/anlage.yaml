# Anlagenbeschreibung für die Simulation (Schnittstelle AP1 -> AP3).
#
# Jeder Parameter hat die Form {wert, herkunft, beleg}.
#   herkunft: mes        = direkt aus einer MES-Tabelle gelesen
#             abgeleitet = aus MES-Daten berechnet (Filter siehe docs/projekt/datenmodell-mes.md)
#             annahme    = Szenario- oder Modellannahme (docs/projekt/annahmen-und-datenluecken.md)
#             offen      = noch nicht belegbar; wert ist null, die Simulation darf ihn nicht nutzen
# Zeiten in Sekunden. Stand der MES-Werte: Snapshot 2026-11-09 15:57.
schema_version: 1
zeiteinheit: s

teile:
  800: IoT main PCB
  811: IoT gyroscope
  812: IoT weatherstation
  813: IoT analog PCB
  814: IoT Display
  831: IoT front bk
  832: IoT front blue
  833: IoT front red
  834: IoT front grey

box:
  typ_pno: {wert: 29, herkunft: mes, beleg: "tblboxdef.BoxPNo"}
  positionen: {wert: 8, herkunft: mes, beleg: "tblboxdef.PosCount = 8, RowCount = 4"}
  anzahl_stammdaten: {wert: 40, herkunft: mes, beleg: "tblboxdef.Count; tblbox hat 40 Zeilen"}
  anzahl_verortet: {wert: 21, herkunft: abgeleitet, beleg: "distinct tblbufferpos.BoxID > 0, in allen 6 Snapshots 21 (B-09)"}
  transportboxen_frei:
    wert: 7
    herkunft: abgeleitet
    beleg: "leere verortete Boxen im Snapshot 15:57 ohne Box 38 am AASS1-Cache; als Boxbestand zu bestätigen (A-03)"

materiallager:
  resource_id: {wert: 17, herkunft: mes, beleg: "tblresource: CP-F-ASRS20-B, tblbuffer 17/1 Storage 4x5"}
  lagerplaetze: {wert: 20, herkunft: mes, beleg: "tblbufferpos ResourceId 17, BufNo 1: 20 Zeilen"}
  # Anfangsbestand je Teil: nur Teile in verorteten Boxen (B-10). Snapshot 15:57, alles frei.
  anfangsbestand:
    800: {wert: 4, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen; weitere 5 in nicht verorteten Boxen"}
    811: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen"}
    812: {wert: 9, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen"}
    813: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen"}
    814: {wert: 4, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen; weitere 9 in nicht verorteten Boxen"}
    831: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen"}
    832: {wert: 8, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen; 1 weiteres in nicht verorteter Box"}
    833: {wert: 7, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen"}
    834: {wert: 9, herkunft: abgeleitet, beleg: "tblboxpos in verorteten Boxen"}

kommissionierplatz:
  resource_id: {wert: 19, herkunft: mes, beleg: "tblresource: CP-PICKSORT"}
  gleichzeitige_chargen: {wert: 1, herkunft: annahme, beleg: "A-04: am 09.11.2026 liefen die Kommissionieraufträge nacheinander"}
  pickzeit_je_teil_s: {wert: 23, herkunft: abgeleitet, beleg: "Median OpNo 220 an Ressource 19, n = 748, q10/q90 = 21/25 s (B-13)"}
  pickzeit_stammdaten_s: {wert: 20, herkunft: mes, beleg: "tblresourceoperation 19/220 WorkingTime"}

fahrzeuge:
