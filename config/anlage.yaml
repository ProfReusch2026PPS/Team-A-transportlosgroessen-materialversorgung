# Anlagenbeschreibung für die Simulation (Schnittstelle AP1 -> AP3).
#
# Jeder Parameter hat die Form {wert, herkunft, beleg}.
#   herkunft: mes        = direkt aus einer MES-Tabelle gelesen
#             abgeleitet = aus MES-Daten berechnet (Filter siehe docs/projekt/datenmodell-mes.md)
#             annahme    = Szenario- oder Modellannahme (docs/projekt/annahmen-und-datenluecken.md)
#             offen      = noch nicht belegbar; wert ist null, die Simulation darf ihn nicht nutzen
# Zeiten in Sekunden. Stand der MES-Werte: Snapshot 2026-11-09 15:57.
#
# Zeiten: Festwert = Median der gefilterten Schritte (Hauptvergleich). Für das Szenario
# "unsicherheit" gibt es zu jedem Zeitparameter mit Verteilung eine empirische Verteilung unter
# demselben Parameterpfad: matsim.daten.zeiten.verteilung("kommissionierplatz.pickzeit_je_teil_s")
# liefert ein Objekt mit .ziehe(rng). Erzeugt mit "python -m matsim.daten zeiten".
schema_version: 1
zeiteinheit: s
zeitverteilungen:
  wert: data/processed/zeitverteilungen.json
  herkunft: abgeleitet
  beleg: "matsim.daten.zeiten.leite_verteilungen_ab, Snapshot 15:57; Störungen entfernt (datenmodell-mes.md, Abschnitt 6)"

teile:
  800: IoT main PCB
  811: IoT gyroscope
  812: IoT weatherstation
  813: IoT analog PCB
  814: IoT Display
  831: IoT front bk
  832: IoT front blue
  833: IoT front red
  834: IoT front grey

box:
  typ_pno: {wert: 29, herkunft: mes, beleg: "tblboxdef.BoxPNo"}
  positionen: {wert: 8, herkunft: mes, beleg: "tblboxdef.PosCount = 8, RowCount = 4"}
  # Boxbestand nur aus tblbufferpos, jede Box einmal (doppelt verortete Box 11 über den jüngsten
  # Zeitstempel aufgelöst, B-11). Funktion: matsim.daten.bestand.startbestand, Snapshot 15:57.
  # 21 verortete Boxen = 7 leere Transportboxen + 13 Quellboxen mit Teilen + Box 38 an AASS1.
  anzahl_stammdaten: {wert: 40, herkunft: mes, beleg: "tblboxdef.Count; tblbox hat 40 Zeilen"}
  anzahl_verortet: {wert: 21, herkunft: abgeleitet, beleg: "distinct tblbufferpos.BoxID > 0, in allen 6 Snapshots 21 (B-09)"}
  anzahl_ohne_ort:
    wert: 19
    herkunft: abgeleitet
    beleg: "nicht in tblbufferpos, in allen 6 Snapshots gleich; seit 30.10.2026 nicht kommissioniert, 5 nie (B-21); gehen nicht in die Simulation (A-03, L-08)"
  transportboxen_frei:
    wert: 7
    herkunft: abgeleitet
    beleg: "leere verortete Boxen 2, 4, 11, 15, 18, 34, 39 im Snapshot 15:57; ohne Box 38 am Handarbeitsplatz AASS1 (seit 12.03.2026 nicht kommissioniert) (A-03)"
  quellboxen_mit_teilen:
    wert: 13
    herkunft: abgeleitet
    beleg: "verortete Boxen mit freien Teilen im Lager 17, Snapshot 15:57; ihr Inhalt ist materiallager.anfangsbestand"

# Beladungsregeln (Issue #4). Belege: docs/projekt/datenmodell-mes.md, Abschnitt 5. "mes" heißt:
# im hinterlegten SQL oder Arbeitsplan festgelegt; "abgeleitet": aus der Historie belegt, aber
# vom MES nicht erzwungen.
beladung:
  stationen_je_box:
    wert: 1
    herkunft: abgeleitet
    beleg: "Kommissionierplan WPNo 1/2/3 liefert per OpNo 215 an genau eine Ressource 2/4/6 (tblstepdef Schritt 20); Montage findet Teile nur in einer Box an der eigenen Ressource (tblstepparameterdef 1000/30 Parameter 2); Historie: nie gemischt, 229 Zielbox-Nutzungen (B-23). Keine Sperre im MES (A-06)"
  zielboxen_je_kommissionierauftrag:
    wert: 1
    herkunft: abgeleitet
    beleg: "229 von 229 Kommissionieraufträgen setzen alle Teile in dieselbe Zielbox (tblfinstepparameter Parameter 6)"
  satz_vollstaendig_in_einer_box:
    wert: true
    herkunft: abgeleitet
    beleg: "Aufgabenstellung; Historie WPNo 1000: 262 Sätze vollständig in einer Box, 0 geteilt, 0 unvollständig, 2 ohne Pick (B-24)"
  max_saetze_je_box:
    RASS1: {wert: 4, herkunft: abgeleitet, beleg: "box.positionen 8 / Satzgröße 2; 15 Kommissionieraufträge mit 8 Teilen für RASS1 (B-15)"}
    RASS2: {wert: 4, herkunft: abgeleitet, beleg: "box.positionen 8 / Satzgröße 2; 10 Kommissionieraufträge mit 8 Teilen für RASS2 (B-15)"}
    RASS3: {wert: 8, herkunft: abgeleitet, beleg: "box.positionen 8 / Satzgröße 1; 3 Kommissionieraufträge mit 8 Teilen für RASS3 (B-15)"}
  saetze_verschiedener_auftraege_in_einer_box:
    wert: true
    herkunft: mes
    beleg: "Jede Position eines Kommissionierauftrags nennt ihren Produktionsauftrag (Parameter 8/9); 28 von 229 Aufträgen bündeln Sätze mehrerer Produktionsaufträge, z. B. 9177: 9176/1, 9178/1, 9178/2"
  wiederverwendung_erst_nach_leerung:
    wert: true
    herkunft: abgeleitet
    beleg: "Keine Zielbox trug je Teile zweier Kommissionieraufträge gleichzeitig (B-23); Box 11 erst für 9177 (RASS1), nach Leerung für 9180 (RASS3)"
  reservierung_ab_freigabe:
    wert: true
    herkunft: mes
    beleg: "Quellteile und Zielplätze sind ab Freigabe des Kommissionierauftrags mit dessen ONo/OPos gebunden (Snapshot 15:22: Box 4 Platz 7 für 9179/3); bei Ablieferung bucht das SQL von OpNo 215 auf den Produktionsauftrag um (tblstepdef WPNo 1 Schritt 20 SqlWrite)"
  montage_nur_aus_box_an_eigener_station:
    wert: true
    herkunft: mes
    beleg: "tblstepparameterdef 1000/30, 60, 100, 110, 160 Parameter 2: Boxplatz mit ONo, OPos und PNo des Werkstücks an tblbufferpos.ResourceId der Station"

materiallager:
  resource_id: {wert: 17, herkunft: mes, beleg: "tblresource: CP-F-ASRS20-B, tblbuffer 17/1 Storage 4x5"}
  lagerplaetze: {wert: 20, herkunft: mes, beleg: "tblbufferpos ResourceId 17, BufNo 1: 20 Zeilen"}
  # Anfangsbestand je Teil (A-02): freie Teile (ONo = 0) in verorteten Boxen im Kreislauf,
  # Snapshot 15:57. Grund für 15:57: Ruhezustand nach Produktionsende, keine Reservierungen,
  # keine Box unterwegs. Reservierungen sind kein zusätzlicher Bestand. Funktion:
  # matsim.daten.bestand.startbestand. Achtung: reicht für 4 vollständige Produkte (L-11).
  anfangsbestand:
    800: {wert: 4, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57; weitere 5 in Boxen ohne Ort"}
    811: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57"}
    812: {wert: 9, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57"}
    813: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57"}
    814: {wert: 4, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57; weitere 9 in Boxen ohne Ort"}
    831: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57"}
    832: {wert: 8, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57; 1 weiteres in Box ohne Ort"}
    833: {wert: 7, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57"}
    834: {wert: 9, herkunft: abgeleitet, beleg: "tblboxpos, verortete Boxen, Snapshot 15:57"}
  # Nur für die Sensitivitätsanalyse (A-02): Teile in Boxen ohne Ort, nicht im Basisfall.
  bestand_ohne_ort:
    800: {wert: 5, herkunft: abgeleitet, beleg: "tblboxpos, Boxen 14 und 23 ohne Ort (B-10)"}
    814: {wert: 9, herkunft: abgeleitet, beleg: "tblboxpos, Boxen 1 und 14 ohne Ort (B-10)"}
    832: {wert: 1, herkunft: abgeleitet, beleg: "tblboxpos, Box 19 ohne Ort (B-10)"}
  vollstaendige_produkte_aus_anfangsbestand:
    wert: 4
    herkunft: abgeleitet
    beleg: "Minimum über die Sätze von WPNo 1000: RASS1 min(800: 4, 814: 4) = 4, RASS2 min(813: 5, 811: 5) = 5, RASS3 831: 5 (L-11)"

kommissionierplatz:
  resource_id: {wert: 19, herkunft: mes, beleg: "tblresource: CP-PICKSORT"}
  gleichzeitige_chargen: {wert: 1, herkunft: abgeleitet, beleg: "229 Kommissionieraufträge 11.06.2025 bis 09.11.2026, kein überlappendes Paar (zeiten.kommissionier_ueberlappungen, A-04)"}
  pickzeit_je_teil_s: {wert: 23, herkunft: abgeleitet, beleg: "Median OpNo 220 an Ressource 19, n = 748, q10/q90 = 21/25 s (B-13); Verteilung ohne 26 Störungen über 46 s"}
  pickzeit_stammdaten_s: {wert: 20, herkunft: mes, beleg: "tblresourceoperation 19/220 WorkingTime"}

fahrzeuge:
  anzahl_stammdaten: {wert: 6, herkunft: mes, beleg: "tblresource 20-25 LOG-MR-B"}
  anzahl: {wert: 2, herkunft: annahme, beleg: "A-05: seit 03.11.2026 melden nur die Robotinos 24 und 25 Busy-Abschnitte, höchstens 2 gleichzeitig (tblmachinereport, B-22); an früheren Tagen 1 bis 6 aktiv und bis zu 6 gleichzeitig; mehr Fahrzeuge nur als Sensitivität"}
  boxplaetze_je_fahrzeug: {wert: 1, herkunft: mes, beleg: "tblbuffer 20-25: storage 1x1"}
  hintransport_s:
    wert: 130
    herkunft: abgeleitet
    beleg: "Median Ende letzter Pick bis Ende erster OpNo 215, n = 229; enthält Warten auf ein Fahrzeug. Nur verwenden, wenn Fahrzeuge nicht als Ressource modelliert sind (A-07)"
  # Mit Fahrzeugen als Ressource: Fahrauftrag statt hintransport_s, das Warten entsteht im Modell.
  fahrauftrag_s:
    wert: 96
    herkunft: abgeleitet
    beleg: "Median (nach Entfernen einer Störung) Aufnahme an der Kommissionierung, Fahrt und Übergabe bis Start OpNo 215, aus Busy-Abschnitten in tblmachinereport, n = 170 von 229 zuordenbar, q10/q90 = 68/143 s (B-22, L-03); am 09.11.2026: 109, 113, 109 s"
  leerboxruecktransport_s:
    wert: 96
    herkunft: annahme
    beleg: "A-09: wie fahrauftrag_s (gleiche Strecke Station - Lager, gleiche Übergaben); Rückfahrten sind weder in tblfinstep noch eindeutig in tblmachinereport erkennbar (L-03)"

