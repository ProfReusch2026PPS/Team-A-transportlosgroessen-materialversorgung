    materialsatz:
      813: {wert: 1, herkunft: mes, beleg: "tblstepdef 1000/100 OpNo 324, Parameter 4 = 813"}
      811: {wert: 1, herkunft: mes, beleg: "tblstepdef 1000/110 OpNo 324, Parameter 4 = 811"}
    zulaessige_teile: {wert: [811, 812, 813], herkunft: mes, beleg: "tblpnogroup 6 'RASS2 material'; Auswahlliste WPNo 2"}
    montagezeit_je_teil_s: {wert: 39, herkunft: abgeleitet, beleg: "Median OpNo 324 an Ressource 4, n = 213"}
  RASS3:
