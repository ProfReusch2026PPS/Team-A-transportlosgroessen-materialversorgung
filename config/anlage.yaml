  # Bandtopologie laut tbltopology: Stationsfolge der inneren Schleife.
  schleife: {wert: [10, 11, 12, 13, 2, 3, 4, 5, 6, 7], herkunft: mes, beleg: "tbltopology: 10->11->12->13->2->3->4->5->6->7->10"}
  auslagern_s: {wert: 16, herkunft: abgeleitet, beleg: "Median OpNo 212 an Ressource 1, n = 132"}
  einlagern_s: {wert: 15, herkunft: abgeleitet, beleg: "Median OpNo 211 an Ressource 1, n = 145"}
