    herkunft: abgeleitet
    beleg: "Median Ende letzter Pick bis Ende erster OpNo 215, n = 229; enthält Wartezeiten, keine reine Fahrzeit (B-14, L-03)"
  leerboxruecktransport_s: {wert: null, herkunft: offen, beleg: "L-03: Robotino-Fahrten stehen nicht in tblfinstep"}

stationen:
  RASS1:
    resource_id: {wert: 2, herkunft: mes, beleg: "tblresource: CP-F-RASS-1"}
    uebergabeplaetze: {wert: 2, herkunft: mes, beleg: "tblbuffer 2/1 Box 1x2; tblbufferpos 2 Zeilen"}
    materialsatz:
      800: {wert: 1, herkunft: mes, beleg: "tblstepdef 1000/30 OpNo 323, Parameter 3 = 800"}
      814: {wert: 1, herkunft: mes, beleg: "tblstepdef 1000/60 OpNo 323, Parameter 3 = 814"}
    zulaessige_teile: {wert: [800, 814], herkunft: mes, beleg: "tblpnogroup 5 'RASS1 material'; Auswahlliste WPNo 1, Schritt 10, Parameter 11"}
