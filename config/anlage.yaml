  anzahl: {wert: 2, herkunft: annahme, beleg: "A-05: am Nachmittag des 09.11.2026 meldeten nur die Ressourcen 24 und 25 (tblmachinereport)"}
  boxplaetze_je_fahrzeug: {wert: 1, herkunft: mes, beleg: "tblbuffer 20-25: storage 1x1"}
  hintransport_s:
